<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert heraldic seal — party per cross, four quadrants -->

  <!-- Rings -->
  <circle cx="60" cy="60" r="58" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <circle cx="60" cy="60" r="53" stroke="currentColor" stroke-width="0.5" fill="none"/>

  <!-- Cross dividers -->
  <line x1="60" y1="11" x2="60" y2="109" stroke="currentColor" stroke-width="0.5"/>
  <line x1="11" y1="60" x2="109" y2="60" stroke="currentColor" stroke-width="0.5"/>

  <!-- Cross center ornament -->
  <circle cx="60" cy="60" r="3" fill="none" stroke="currentColor" stroke-width="0.5"/>
  <circle cx="60" cy="60" r="0.5" fill="currentColor"/>

  <!-- ══ I (top): Saguaro cactus ══ -->
  <path d="M 56 50 L 56 38 L 48 38 L 48 29 L 53 29 L 53 34 L 56 34
           L 56 20 L 64 20 L 64 32 L 72 32 L 72 24 L 68 24 L 68 34
           L 64 34 L 64 50 Z"
        fill="currentColor"/>

  <!-- ══ II (left): Scorpion, petroglyph style ══ -->
  <g>
    <!-- Body segments -->
    <ellipse cx="32" cy="62" rx="4.5" ry="2.5" fill="currentColor"/>
    <circle cx="38" cy="62" r="2.5" fill="currentColor"/>
    <!-- Iconic curled tail -->
    <path d="M 28 61 C 22 58 18 52 22 47 C 26 43 32 45 30 50"
          stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Stinger -->
    <path d="M 30 50 L 28 46 L 33 48 Z" fill="currentColor"/>
    <!-- Pincers -->
    <path d="M 40 60 Q 43 57 46 54" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 40 64 Q 43 67 46 70" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="46" cy="54" r="1.5" fill="currentColor"/>
    <circle cx="46" cy="70" r="1.5" fill="currentColor"/>
  </g>

  <!-- ══ III (right): Gecko, petroglyph style ══ -->
  <g fill="currentColor">
    <!-- Body -->
    <ellipse cx="88" cy="62" rx="7" ry="3"/>
    <!-- Head with pointed snout -->
    <path d="M 82 62 L 74 59 L 75 62 L 74 65 Z"/>
    <!-- Spread legs (petroglyph splayed) -->
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M 85 59 L 82 53"/>
      <path d="M 85 65 L 82 71"/>
      <path d="M 91 59 L 94 53"/>
      <path d="M 91 65 L 94 71"/>
    </g>
    <!-- Splayed toes -->
    <g stroke="currentColor" stroke-width="0.8" stroke-linecap="round" fill="none">
      <path d="M 82 53 L 80 51 M 82 53 L 83 50 M 82 53 L 81 50"/>
      <path d="M 82 71 L 80 73 M 82 71 L 83 74 M 82 71 L 81 74"/>
      <path d="M 94 53 L 96 51 M 94 53 L 93 50 M 94 53 L 95 50"/>
      <path d="M 94 71 L 96 73 M 94 71 L 93 74 M 94 71 L 95 74"/>
    </g>
    <!-- Curling tail -->
    <path d="M 95 62 Q 102 60 103 54 Q 103 49 98 49"
          stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ══ IV (bottom): Diagonal zigzag bands ══ -->
  <g stroke="currentColor" stroke-width="1" fill="none">
    <path d="M 28 90 L 34 84 L 40 88 L 46 82 L 52 86 L 58 80 L 64 84 L 70 78 L 76 82 L 82 76 L 88 80"/>
    <path d="M 34 98 L 40 92 L 46 96 L 52 90 L 58 94 L 64 88 L 70 92 L 76 86 L 82 90 L 88 84"/>
    <path d="M 40 106 L 46 100 L 52 104 L 58 98 L 64 102 L 70 96 L 76 100 L 80 94"/>
  </g>
</svg>
