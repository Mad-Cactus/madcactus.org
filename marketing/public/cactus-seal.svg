<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert heraldic seal — Precision Geometric Tribal Redesign -->

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="52" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- Bold X dividers (saltire — corner to corner at 45°) -->
  <line x1="21" y1="21" x2="99" y2="99" stroke="currentColor" stroke-width="2"/>
  <line x1="99" y1="21" x2="21" y2="99" stroke="currentColor" stroke-width="2"/>

  <!-- Center junction ornament -->
  <circle cx="60" cy="60" r="3.5" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- ══ TOP-CENTER: Tribal Saguaro (Perfect Symmetry) ══ -->
  <g fill="currentColor">
    <!-- Symmetric central trunk and arms -->
    <path d="M 57 48 V 32 H 51 C 49 32 49 22 53 22 Q 55 22 55 26 V 28 H 57 V 17 C 57 14 63 17 63 17 V 28 H 65 V 26 Q 65 22 67 22 C 71 22 71 32 67 32 H 63 V 48 Z"/>
    
    <!-- Minimal crisp needles (exact coordinates) -->
    <path d="M 49 26 H 46 M 71 26 H 74 M 55 38 H 53 M 65 38 H 67" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Ground plane line -->
    <line x1="48" y1="48" x2="72" y2="48" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ══ LEFT-LEFT: Tribal Scorpion (Geometrically Polished) ══ -->
  <g fill="currentColor">
    <!-- Symmetrical abdomen body segments -->
    <ellipse cx="32" cy="60" rx="6" ry="3.5"/>
    <rect x="29" y="57" width="1.2" height="6" fill="#ffffff" stroke="none"/>
    <rect x="32" y="56" width="1.2" height="8" fill="#ffffff" stroke="none"/>
    <rect x="35" y="57" width="1.2" height="6" fill="#ffffff" stroke="none"/>

    <!-- Head -->
    <path d="M 38 60 L 42 57 L 42 63 Z"/>

    <!-- Beautiful, clean circular claws -->
    <path d="M 40 58.5 C 42 56 45 56 44 50" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 40 61.5 C 42 64 45 64 44 70" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="44" cy="50" r="1.5"/>
    <circle cx="44" cy="70" r="1.5"/>

    <!-- Perfectly smooth circular tail arc (radius based) -->
    <path d="M 28 60 A 10 10 0 0 1 28 40 A 5 5 0 0 1 34 44" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Stinger tip -->
    <path d="M 34 44 L 37 41 L 34 39 Z"/>
  </g>

  <!-- ══ RIGHT-RIGHT: Tribal Gecko / Lizard (Precision Symmetrical) ══ -->
  <g fill="currentColor">
    <!-- Segmented diamond body -->
    <ellipse cx="88" cy="60" rx="9" ry="3.8"/>
    <!-- Elegant tribal backbone diamond mask cuts -->
    <path d="M 81 60 L 85 57.5 L 89 60 L 85 62.5 Z" fill="#ffffff" stroke="none"/>
    <path d="M 87 60 L 91 57.5 L 95 60 L 91 62.5 Z" fill="#ffffff" stroke="none"/>

    <!-- Head facing center -->
    <path d="M 79 60 L 73 57 L 73 63 Z"/>

    <!-- Clean splayed limbs (mathematically mirrored) -->
    <!-- Front limbs -->
    <path d="M 83.5 56.5 L 79.5 50.5 M 83.5 63.5 L 79.5 69.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Back limbs -->
    <path d="M 91.5 56.5 L 95.5 50.5 M 91.5 63.5 L 95.5 69.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Bold, polished horizontal foot plates -->
    <line x1="77.5" y1="50.5" x2="81.5" y2="50.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="77.5" y1="69.5" x2="81.5" y2="69.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="93.5" y1="50.5" x2="97.5" y2="50.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="93.5" y1="69.5" x2="97.5" y2="69.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

    <!-- Smooth waving tail curving away from dividers -->
    <path d="M 97 60 C 103 59 105 52 101 48 C 97 44 93 48 95 51" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ══ BOTTOM-CENTER: Triangle with Precision Chevron Waves ══ -->
  <!-- Clip path to keep chevrons strictly bound within the bottom wedge -->
  <defs>
    <clipPath id="bottom-triangle">
      <!-- Triangle vertex points strictly within lower 45-deg diagonal limits -->
      <polygon points="60,73.5 38.5,101 81.5,101"/>
    </clipPath>
  </defs>

  <!-- Solid clean triangle container -->
  <polygon points="60,72 36,104 84,104" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" fill="none"/>

  <!-- Perfectly aligned parallel tribal chevron paths (lightning/water motif) -->
  <g clip-path="url(#bottom-triangle)" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 30 76 L 36 82 L 42 76 L 48 82 L 54 76 L 60 82 L 66 76 L 72 82 L 78 76 L 84 82 L 90 76"/>
    <path d="M 30 84 L 36 90 L 42 84 L 48 90 L 54 84 L 60 90 L 66 84 L 72 90 L 78 84 L 84 90 L 90 84"/>
    <path d="M 30 92 L 36 98 L 42 92 L 48 98 L 54 92 L 60 98 L 66 92 L 72 98 L 78 92 L 84 98 L 90 92"/>
    <path d="M 30 100 L 36 106 L 42 100 L 48 106 L 54 100 L 60 106 L 66 100 L 72 106 L 78 100 L 84 106 L 90 100"/>
  </g>
</svg>
