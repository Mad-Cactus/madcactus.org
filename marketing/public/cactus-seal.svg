<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert heraldic seal — FMR saltire (X) division -->

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="52" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- Bold X dividers (saltire — corner to corner at 45°) -->
  <line x1="21" y1="21" x2="99" y2="99" stroke="currentColor" stroke-width="2"/>
  <line x1="99" y1="21" x2="21" y2="99" stroke="currentColor" stroke-width="2"/>

  <!-- Center junction ornament -->
  <circle cx="60" cy="60" r="3.5" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- ══ TOP-CENTER: Saguaro cactus ══ -->
  <g fill="currentColor">
    <!-- Main trunk -->
    <rect x="56" y="14" width="8" height="32" rx="2"/>
    <!-- Left arm -->
    <path d="M 56 26 L 50 26 L 50 16 L 46 16 L 46 30 L 56 30 Z"/>
    <!-- Right arm -->
    <path d="M 64 22 L 70 22 L 70 14 L 74 14 L 74 28 L 64 28 Z"/>
    <!-- Ground line -->
    <rect x="48" y="46" width="24" height="2"/>
  </g>

  <!-- ══ LEFT-LEFT: Scorpion (petroglyph, facing left) ══ -->
  <g fill="currentColor">
    <!-- Body segments -->
    <rect x="36" y="56" width="8" height="4" rx="1"/>
    <circle cx="34" cy="58" r="2.5"/>
    <circle cx="29" cy="56" r="2"/>
    <!-- Head with pincers -->
    <circle cx="25" cy="54" r="1.8"/>
    <path d="M 23 53 L 18 49" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 23 55 L 18 59" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="17" cy="49" r="1.2"/>
    <circle cx="17" cy="59" r="1.2"/>
    <!-- Curled tail arching up -->
    <path d="M 44 56 C 50 52 52 46 48 42 C 44 39 40 42 42 46"
          stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Stinger -->
    <path d="M 42 46 L 40 42 L 45 43 Z"/>
  </g>

  <!-- ══ RIGHT-RIGHT: Gecko (petroglyph, facing right) ══ -->
  <g fill="currentColor">
    <!-- Body -->
    <ellipse cx="86" cy="58" rx="7" ry="3"/>
    <!-- Head with pointed snout -->
    <path d="M 93 58 L 101 55 L 100 58 L 101 61 Z"/>
    <!-- Spread legs -->
    <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M 82 55 L 79 50"/>
      <path d="M 82 61 L 79 66"/>
      <path d="M 90 55 L 93 50"/>
      <path d="M 90 61 L 93 66"/>
    </g>
    <!-- Splayed toes -->
    <g stroke="currentColor" stroke-width="0.7" stroke-linecap="round" fill="none">
      <path d="M 79 50 L 77 47 M 79 50 L 80 46 M 79 50 L 78 47"/>
      <path d="M 79 66 L 77 69 M 79 66 L 80 70 M 79 66 L 78 69"/>
      <path d="M 93 50 L 95 47 M 93 50 L 92 46 M 93 50 L 94 47"/>
      <path d="M 93 66 L 95 69 M 93 66 L 92 70 M 93 66 L 94 69"/>
    </g>
    <!-- Curling tail with spiral -->
    <path d="M 79 58 Q 73 56 72 50 Q 72 46 76 46 Q 79 46 78 49"
          stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ══ BOTTOM-CENTER: Diamond with diagonal zigzag bands ══ -->
  <!-- Diamond shape frame -->
  <path d="M 60 76 L 92 92 L 60 108 L 28 92 Z"
        stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Diagonal zigzag lines inside -->
  <path d="M 38 90 L 43 86 L 49 90 L 55 86 L 61 90 L 67 86 L 73 90 L 79 86"
        stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 43 96 L 49 92 L 55 96 L 61 92 L 67 96 L 73 92"
        stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 49 102 L 55 98 L 61 102 L 67 98"
        stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
