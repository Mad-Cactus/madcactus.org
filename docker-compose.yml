# Local dev stack.
#
#   docker compose up -d          → Postgres only (for `bun run dev` hot reload)
#   docker compose up --build app → full stack incl. the prod Docker image
#                                   (what fly runs) at http://localhost:3001
#
# Schema + seed (one-time, host needs bun):
#   cd dashboard && bun run db:push && psql "$(grep ^DATABASE_URL .env | cut -d= -f2-)" -f ../supabase/seed.sql
#
# Auth goes through the hosted Supabase project (keys in dashboard/.env) —
# no local supabase stack needed to log in.

services:
  db:
    image: postgres:17-alpine
    # 5433 on the host — stays out of the way of any local Postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: madcactus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d madcactus"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    profiles: ["app"]
    build: ./dashboard
    ports:
      - "3001:3000"
    environment:
      # env_file provides the Supabase/Gmail/etc. keys; DATABASE_URL points at
      # the compose service, not the host-mapped 5433.
      DATABASE_URL: postgres://postgres:postgres@db:5432/madcactus
    env_file:
      - dashboard/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
