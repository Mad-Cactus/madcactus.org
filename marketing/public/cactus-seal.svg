<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert heraldic seal — FMR-style four quadrant composition -->

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="52" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- Bold cross dividers (FMR-style thick) -->
  <line x1="60" y1="8" x2="60" y2="112" stroke="currentColor" stroke-width="2"/>
  <line x1="8" y1="60" x2="112" y2="60" stroke="currentColor" stroke-width="2"/>

  <!-- Center junction ornament -->
  <circle cx="60" cy="60" r="4" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- ══ TOP QUADRANT: Saguaro cactus ══ -->
  <g fill="currentColor">
    <!-- Main trunk -->
    <rect x="56" y="14" width="8" height="36" rx="2"/>
    <!-- Left arm -->
    <path d="M 56 28 L 50 28 L 50 16 L 46 16 L 46 32 L 56 32 Z"/>
    <!-- Right arm -->
    <path d="M 64 24 L 70 24 L 70 14 L 74 14 L 74 30 L 64 30 Z"/>
    <!-- Ground line -->
    <rect x="50" y="50" width="20" height="2"/>
  </g>

  <!-- ══ LEFT QUADRANT: Scorpion (petroglyph, facing left) ══ -->
  <g fill="currentColor">
    <!-- Body: 3 segments + head -->
    <rect x="32" y="58" width="8" height="4" rx="1"/>
    <circle cx="30" cy="60" r="3"/>
    <circle cx="24" cy="60" r="2.5"/>
    <!-- Head with pincers -->
    <circle cx="20" cy="60" r="2"/>
    <path d="M 18 59 L 12 54" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 18 61 L 12 66" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="11" cy="54" r="1.5"/>
    <circle cx="11" cy="66" r="1.5"/>
    <!-- Iconic curled tail arching up and back -->
    <path d="M 40 58 C 46 54 48 48 44 44 C 40 41 36 44 38 48"
          stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Stinger tip -->
    <path d="M 38 48 L 36 44 L 41 45 Z"/>
  </g>

  <!-- ══ RIGHT QUADRANT: Gecko (petroglyph, facing right) ══ -->
  <g fill="currentColor">
    <!-- Body -->
    <ellipse cx="90" cy="60" rx="8" ry="3.5"/>
    <!-- Head with pointed snout -->
    <path d="M 98 60 L 106 57 L 105 60 L 106 63 Z"/>
    <!-- Spread legs — petroglyph splayed style -->
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 86 57 L 83 52"/>
      <path d="M 86 63 L 83 68"/>
      <path d="M 94 57 L 97 52"/>
      <path d="M 94 63 L 97 68"/>
    </g>
    <!-- Splayed toes -->
    <g stroke="currentColor" stroke-width="0.8" stroke-linecap="round" fill="none">
      <path d="M 83 52 L 81 49 M 83 52 L 84 48 M 83 52 L 82 49"/>
      <path d="M 83 68 L 81 71 M 83 68 L 84 72 M 83 68 L 82 71"/>
      <path d="M 97 52 L 99 49 M 97 52 L 96 48 M 97 52 L 98 49"/>
      <path d="M 97 68 L 99 71 M 97 68 L 96 72 M 97 68 L 98 71"/>
    </g>
    <!-- Curling tail with spiral -->
    <path d="M 82 60 Q 76 58 75 52 Q 75 48 79 48 Q 82 48 81 51"
          stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ══ BOTTOM QUADRANT: Diagonal zigzag bands ══ -->
  <!-- Diamond shape frame -->
  <path d="M 60 64 L 104 86 L 60 108 L 16 86 Z"
        stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Diagonal zigzag lines inside -->
  <path d="M 26 84 L 31 80 L 37 84 L 43 80 L 49 84 L 55 80 L 61 84 L 67 80 L 73 84 L 79 80 L 85 84 L 91 80"
        stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 31 92 L 37 88 L 43 92 L 49 88 L 55 92 L 61 88 L 67 92 L 73 88 L 79 92 L 85 88"
        stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M 37 100 L 43 96 L 49 100 L 55 96 L 61 100 L 67 96 L 73 100 L 79 96"
        stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
