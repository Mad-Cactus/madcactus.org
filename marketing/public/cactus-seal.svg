<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Desert heraldic seal — FMR saltire (X) division with Native American tribal elements -->

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Inner ring -->
  <circle cx="60" cy="60" r="52" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- Bold X dividers (saltire — corner to corner at 45°) -->
  <line x1="21" y1="21" x2="99" y2="99" stroke="currentColor" stroke-width="2"/>
  <line x1="99" y1="21" x2="21" y2="99" stroke="currentColor" stroke-width="2"/>

  <!-- Center junction ornament -->
  <circle cx="60" cy="60" r="3.5" stroke="currentColor" stroke-width="1" fill="none"/>

  <!-- ══ TOP-CENTER: Tribal Saguaro (Geometric native style) ══ -->
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <!-- Main Saguaro outline -->
    <path d="M 56 46 V 20 C 56 16 64 16 64 20 V 46" stroke-width="2"/>
    <!-- Vertical rib line inside trunk -->
    <path d="M 60 19 V 46" stroke-width="1.2"/>
    
    <!-- Left arm outline -->
    <path d="M 56 34 H 48 C 44 34 44 22 48 22 V 29" stroke-width="2"/>
    <path d="M 48 28 V 24" stroke-width="1.2"/>
    
    <!-- Right arm outline -->
    <path d="M 64 30 H 72 C 76 30 76 18 72 18 V 25" stroke-width="2"/>
    <path d="M 72 24 V 20" stroke-width="1.2"/>

    <!-- Ground line -->
    <rect x="46" y="46" width="28" height="1.5" fill="currentColor" stroke="none"/>

    <!-- Needles / Spikes (tribal cross-hatch needles) -->
    <!-- Trunk needles -->
    <path d="M 56 40 H 53 M 56 30 H 53 M 56 24 H 53" stroke-width="1"/>
    <path d="M 64 42 H 67 M 64 36 H 67 M 64 26 H 67" stroke-width="1"/>
    <!-- Left arm needles -->
    <path d="M 44 26 H 41 M 48 22 V 19" stroke-width="1"/>
    <!-- Right arm needles -->
    <path d="M 76 22 H 79 M 72 18 V 15" stroke-width="1"/>
  </g>

  <!-- Flanking Tribal Suns / Star Motifs inside top wedge -->
  <g fill="currentColor">
    <!-- Left sun (42, 22) -->
    <circle cx="41" cy="21" r="2"/>
    <g stroke="currentColor" stroke-width="1" stroke-linecap="round">
      <line x1="41" y1="16" x2="41" y2="18"/>
      <line x1="41" y1="24" x2="41" y2="26"/>
      <line x1="36" y1="21" x2="38" y2="21"/>
      <line x1="44" y1="21" x2="46" y2="21"/>
    </g>
    <!-- Right sun (78, 22) -->
    <circle cx="79" cy="21" r="2"/>
    <g stroke="currentColor" stroke-width="1" stroke-linecap="round">
      <line x1="79" y1="16" x2="79" y2="18"/>
      <line x1="79" y1="24" x2="79" y2="26"/>
      <line x1="74" y1="21" x2="76" y2="21"/>
      <line x1="82" y1="21" x2="84" y2="21"/>
    </g>
  </g>

  <!-- ══ LEFT-LEFT: Tribal Scorpion (Beaded/Crescent style) ══ -->
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <!-- Abdomen outline (broad oval) -->
    <path d="M 28 60 C 28 54 38 54 38 60 C 38 66 28 66 28 60 Z" stroke-width="2"/>
    <!-- Internal cross rib/hatching -->
    <path d="M 31 55 V 65" stroke-width="1.2"/>
    <path d="M 35 55 V 65" stroke-width="1.2"/>
    <circle cx="34" cy="60" r="1" fill="currentColor"/>

    <!-- Head block -->
    <path d="M 28 60 L 23 57 L 23 63 Z" fill="currentColor"/>

    <!-- Scorpion claws (bold geometric crescents) -->
    <path d="M 23 58 C 17 56 12 50 12 44 Q 9 44 9 48 C 10 54 17 58 23 58" fill="currentColor" stroke="none"/>
    <path d="M 23 62 C 17 64 12 70 12 76 Q 9 70 9 66 C 10 60 17 62 23 62" fill="currentColor" stroke="none"/>
    <!-- Symmetrical needle/pincer inside claw -->
    <path d="M 12 44 C 13 48 16 52 23 54" stroke-width="1"/>
    <path d="M 12 76 C 13 72 16 68 23 66" stroke-width="1"/>

    <!-- Beaded tail joints (diminishing circles) -->
    <circle cx="41" cy="57" r="2.8" fill="currentColor" stroke="none"/>
    <circle cx="44" cy="52" r="2.2" fill="currentColor" stroke="none"/>
    <circle cx="45" cy="46" r="1.8" fill="currentColor" stroke="none"/>
    <circle cx="43" cy="41" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="39" cy="37" r="1.2" fill="currentColor" stroke="none"/>
    <!-- Stinger hook -->
    <path d="M 38 37 C 34 37 31 39 32 44 C 34 41 36 39 38 37 Z" fill="currentColor" stroke="none"/>
  </g>

  <!-- ══ RIGHT-RIGHT: Tribal Gecko / Kokopelli Lizard ══ -->
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <!-- Abdomen outline -->
    <path d="M 82 60 C 82 54 94 54 94 60 C 94 66 82 66 82 60 Z" stroke-width="2"/>
    <!-- Diamond backbone detail (classic Native American geometry) -->
    <path d="M 82 60 L 88 56 L 94 60 L 88 64 Z" stroke-width="1"/>
    <path d="M 88 56 V 64" stroke-width="1"/>
    <path d="M 82 60 H 94" stroke-width="1"/>
    <circle cx="88" cy="60" r="1.2" fill="currentColor" stroke="none"/>

    <!-- Pointed geometric head -->
    <path d="M 94 60 L 100 56 L 100 64 Z" fill="currentColor"/>
    <!-- Eyes -->
    <circle cx="97" cy="58" r="0.8" fill="#ffffff" stroke="none"/>
    <circle cx="97" cy="62" r="0.8" fill="#ffffff" stroke="none"/>

    <!-- Geometric splayed legs (thick outlines) -->
    <path d="M 85 55 V 47 H 81" stroke-width="2"/>
    <path d="M 85 65 V 73 H 81" stroke-width="2"/>
    <path d="M 91 55 V 47 H 95" stroke-width="2"/>
    <path d="M 91 65 V 73 H 95" stroke-width="2"/>
    <!-- Splayed geometric toes -->
    <g stroke-width="0.8">
      <path d="M 81 47 L 79 45 M 81 47 L 81 44 M 81 47 L 78 47"/>
      <path d="M 81 73 L 79 75 M 81 73 L 81 76 M 81 73 L 78 73"/>
      <path d="M 95 47 L 97 45 M 95 47 L 95 44 M 95 47 L 98 47"/>
      <path d="M 95 73 L 97 75 M 95 73 L 95 76 M 95 73 L 98 73"/>
    </g>

    <!-- Concentric spiral tail curving left (Kokopelli style) -->
    <path d="M 82 60 A 8 8 0 0 0 74 52 A 6 6 0 0 0 80 46 A 4 4 0 0 0 84 51 A 2 2 0 0 0 82 53" stroke-width="2"/>
  </g>

  <!-- ══ BOTTOM-CENTER: Tribal Diamond & Wave/Water pattern ══ -->
  <!-- Diamond Frame -->
  <path d="M 60 76 L 92 90 L 60 106 L 28 90 Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
  <!-- Elegant diagonal squiggles (Native American lightning/water) -->
  <g stroke="currentColor" stroke-dasharray="1000" stroke-width="1.2" fill="none" stroke-linejoin="miter">
    <!-- Diagonal Zigzag 1 (upper-middle) -->
    <path d="M 34 102 L 38 96 L 44 100 L 48 94 L 54 98 L 60 92 L 66 96 L 70 90 L 76 94 L 80 88 L 86 92"/>
    <!-- Diagonal Zigzag 2 (upper) -->
    <path d="M 40 94 L 44 88 L 50 92 L 54 86 L 60 90 L 64 84 L 70 88 L 74 82 L 80 86"/>
    <!-- Diagonal Zigzag 3 (lower) -->
    <path d="M 28 110 L 32 104 L 38 108 L 42 102 L 48 106 L 52 100 L 58 104 L 62 98 L 68 102 L 72 96 L 78 100"/>
  </g>
</svg>
