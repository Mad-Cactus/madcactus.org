name: DB drift

# Drift check that prod matches the repo. Runs before migration-touching
# PRs merge and before main's auto-apply reaches Supabase. Catches:
#  1. Supabase GitHub auto-apply silently not running (main ahead of prod)
#  2. Schema changed on prod outside migrations (e.g. someone ran
#     drizzle-kit db:push or SQL editor changes)
#
# Requires repo secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — dashboard DB connection password
# Fails (red) if either is missing.
on:
  pull_request:
    paths: ['supabase/migrations/**']
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Require secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD not set — Settings → Secrets → Actions"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref uzhjhzmgycjmvhkbelgx
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: No pending migrations
        run: |
          # Failure = red: an unverifiable check must not pass. The old version
          # swallowed connection errors and grepped raw JSON, so a dead check
          # reported "Prod is up to date" while a migration sat unapplied.
          out=$(supabase migration list </dev/null)
          pending=$(echo "$out" | jq '[.migrations[] | select(.local != "" and .remote == "")]')
          if [ "$pending" != "[]" ]; then
            echo "::error::Migrations on main not applied to prod (auto-apply broken?):"
            echo "$pending"
            exit 1
          fi
          echo "Prod is up to date with main."
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: No unversioned schema on prod
        run: |
          # db diff prints its JSON to stdout. The old version used -f /tmp/drift.sql,
          # but -f takes a migration NAME and writes into supabase/migrations/, so
          # /tmp/drift.sql never existed and this check passed unconditionally.
          out=$(supabase db diff --linked </dev/null)
          diff_sql=$(echo "$out" | jq -r '.diff // ""')
          if [ -n "$diff_sql" ]; then
            echo "::error::Prod schema differs from what migrations produce — someone changed the DB outside migrations."
            echo "$diff_sql"
            exit 1
          fi
          echo "No drift: prod matches migrations."
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
