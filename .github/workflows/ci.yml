name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      # npm.pkg.github.com requires auth even for public packages (unlike ghcr)
      - name: GitHub Packages auth (@aspectrr)
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          cat >> ~/.npmrc <<EOF
          @aspectrr:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}
          EOF
      - working-directory: dashboard
        run: |
          bun install
          bun run test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: GitHub Packages auth (@aspectrr)
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          cat >> ~/.npmrc <<EOF
          @aspectrr:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}
          EOF
      - working-directory: dashboard
        run: |
          bun install
          bun run typecheck

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # quoted multiline value — the action splits unquoted lines into
          # separate secret specs
          secrets: |
            "npmrc=@aspectrr:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}"
